alias: pstack
display_name: pstack (poteto)
source_url: https://github.com/cursor/plugins/tree/main/pstack
mirror_url: https://github.com/backnotprop/pstack
default_ref: 11713c683fe4add4fd403ea880580abbc9e0875f
license: MIT
license_file: LICENSE
invocation: upstream
skills:
  og: []
  mutations:
    - slug: create-verification-skill
      pack_id: pstack:create-verification-skill
      canonical_id: create-verification-skill
      path: mutations/create-verification-skill
      description: Generate a project-local verification skill (launch, doctor, drive, evidence, cleanup) plus a feature map, then prove it once end to end.
      lifecycle: beta
      public_safe: true
      mutation: true
    - slug: maintain-verification-skill
      pack_id: pstack:maintain-verification-skill
      canonical_id: maintain-verification-skill
      path: mutations/maintain-verification-skill
      description: Audit a project verification skill and its feature map with one source reader per feature and one live pass; ends clean, changed, or blocked.
      lifecycle: beta
      public_safe: true
      mutation: true
    - slug: how
      pack_id: pstack:how
      canonical_id: how
      path: mutations/how
      description: Explain how a subsystem works through parallel read-only explorers and one explainer.
      lifecycle: beta
      public_safe: true
      mutation: true
    - slug: why
      pack_id: pstack:why
      canonical_id: why
      path: mutations/why
      description: Investigate the rationale behind code across git history and every available MCP evidence category, then return a cited, confidence-separated read.
      lifecycle: beta
      public_safe: true
      mutation: true
