  - id: timekeeper-monday-calendar-sync
    name: Timekeeper Monday Calendar Sync
    member: timekeeper
    tier: weekly
    status: active
    default_timing: "Monday morning, with the stand-up (all seats report together)"
    purpose: "This week's calendar against meals, lifts, and work; flag conflicts and empty days."
