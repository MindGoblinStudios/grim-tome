  - id: midas-monday-money-flag
    name: Midas Monday Money Flag
    member: midas
    tier: weekly
    status: active
    default_timing: "Monday morning, with the stand-up (all seats report together)"
    purpose: "One money-shaped flag for the week, from connected finance sources; silent if nothing."
    source: skills/council/council/SKILL.md#weekly-council-stand-up-monday

  - id: helm-monday-priority
    name: Helm Monday Priority
    member: helm
    tier: weekly
    status: active
    default_timing: "Monday morning, with the stand-up (all seats report together)"
    purpose: "One sentence naming the week's top business priority."
    source: skills/council/council/SKILL.md#weekly-council-stand-up-monday

  - id: quill-monday-minutes
    name: Quill Monday Minutes
    member: quill
    tier: weekly
    status: active
    default_timing: "Monday morning, right after the seats report"
    purpose: "Short stand-up minutes into the docs tree; not a second weekly synthesis."
