  - id: roger-monday-gap-patrol
    name: Roger Roger Gap Patrol
    member: roger-roger
    tier: weekly
    status: active
    default_timing: "Monday morning, with the stand-up (all seats report together; opens it)"
    purpose: "Loose ends, dropped threads, and odd jobs nobody else is focusing on."
