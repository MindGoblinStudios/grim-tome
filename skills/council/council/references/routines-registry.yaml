  # --- Wandering (opt-in, random times) ---
  - id: wandering-gossip
    name: Wandering Gossip
    member: council
    tier: wandering
    status: opt-in
    default_timing: "Wandering: about every 1–3 days, random waking hour"
    schedule_type: wandering/self-rescheduling
    schedule_rule: "Each run rolls the next one 1-3 days out at a random waking hour, avoiding other council routines."
    purpose: "An overheard corridor scene about council dynamics; never announced as a routine."
    source: skills/council/councilActions/gossip/SKILL.md#wandering-cadence

  - id: selene-whispered-affirmations
    name: Selene Whispered Affirmations
    member: selene
    tier: wandering
    status: opt-in
    default_timing: "Wandering: one or two times a day, waking hours"
    schedule_type: wandering/self-rescheduling
    schedule_rule: "Rolls itself one or two times a day at varied waking-hours times; never asks for a reply."
