    schedule_type: wandering/self-rescheduling
    schedule_rule: "Each run picks an evening slot 2-4 days out at a varied time; no workday pings."
    purpose: "At most three targeted questions about missing, stale, TODO, or unknown context in the docs and memory; answers recorded via the normal memory/docs path. Separate from the dream sequence."
    source: skills/council/members/quill-scribe/SKILL.md#context-fishing-wandering

  - id: gizmo-wild-card
    name: Gizmo Wild Card
    member: gizmo
    tier: wandering
    status: danger
