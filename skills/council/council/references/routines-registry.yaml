    schedule_type: wandering/self-rescheduling
    schedule_rule: "Each run rebooks 2-4 days out on a weekday, waking hours, avoiding other council routines' slots."
    purpose: "A wandering live idea (weird reframe, dare-sized experiment, rule to break, third option). Never staged as a card draw. One idea, then he scampers."
    source: skills/council/members/gizmo-chaos-goblin/SKILL.md#the-wild-card-wandering-idea

  # --- Install one-shots ---
  - id: midas-tithe-bell
    name: Midas Tithe Bell
    member: midas
    tier: install
    status: one-shot
    default_timing: "Three one-shots after install: 1 week, 30 days, 1 year. No 6-month ring; not recurring."
    purpose: "Look back at real value delivered; a soft tip-jar ask. Each ring fires once, then is removed."
    rings: [tithe-bell-7d, tithe-bell-30d, tithe-bell-1y]
    source: skills/council/council/SKILL.md#the-tithe-bell-1-week-30-days-1-year

notes:
  - This file holds public defaults only; it carries no harness IDs, account details, or clock times.
  - The user's harness is authoritative for actual times and enabled state. When retiming, update this file and the saved routine together.
