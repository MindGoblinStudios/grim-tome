    schedule_type: interval/drifting
    schedule_rule: "Fixed ~60-hour interval; the clock time drifts. Not self-rescheduling."
    purpose: "A soft invitation to jot how the user is feeling. No follow-up if ignored."
    source: skills/council/members/selene-emotional-advisor/SKILL.md#journaling-check-in-wandering

