  - id: boulder-monday-lift-anchors
    name: Boulder Monday Lift Anchors
    member: boulder
    tier: weekly
    status: active
    default_timing: "Monday morning, with the stand-up (all seats report together)"
    purpose: "Place the week's anchor sessions; not the day plan."
