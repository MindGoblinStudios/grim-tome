# Council Routines Registry (public Grim Tome)
# Default routines to offer at install or on request. Behavior lives in the
# member and procedure skills; this file inventories each named routine, its
# default timing, and where it is defined.
# Timings are relative defaults. The user's harness owns actual clock times,
# delivery destinations, and enabled state.
# Last inventory: 2026-10-07

schema_version: 1

# tier: daily | weekly | monthly | yearly | wandering | install
# status: active (weekly core, recommend to everyone) | opt-in | danger (warn first) | one-shot
# Only offer a member's routine when that member is installed.

routines:

  # --- Daily pulse (opt-in) ---
  - id: timekeeper-morning-agenda
    name: Timekeeper Morning Agenda
    member: timekeeper
    tier: daily
    status: opt-in
    default_timing: "Morning (adaptive)"
    purpose: "Today's plan against real capacity."
    source: skills/council/members/timekeeper-day-planner/SKILL.md#standing-cadence

  - id: timekeeper-evening-plan-ahead
    name: Timekeeper Nightly Plan-Ahead
    member: timekeeper
    tier: daily
    status: opt-in
    default_timing: "Night (adaptive)"
    purpose: "Close today; sketch tomorrow."
    source: skills/council/members/timekeeper-day-planner/SKILL.md#standing-cadence

  - id: precog-on-track-nudges
    name: Precog On-Track Nudges
    member: precog
    tier: daily
    status: opt-in
    default_timing: "Daily, wandering through the day after the morning agenda; about 3–5 pings, ending by evening"
    schedule_type: wandering/self-rescheduling
    schedule_rule: "Daily morning home slot; after each nudge it books the next one a few minutes before the next key block (about 3-5 a day, ending by evening), then resets to the home slot."
    purpose: "Reads the day planner's plan and nudges just before key blocks: the current or next block and the one thing to do now. Silent if no plan exists."
    source: skills/council/members/precog-exec-func/SKILL.md#on-track-nudges-daily-wandering

  - id: boulder-daily-movement
    name: Boulder Daily Movement Plan
    member: boulder
    tier: daily
    status: opt-in
    default_timing: "Morning, every day"
    purpose: "Today's movement plan, even on rest days. A ten minute walk is a plan."
    source: skills/council/members/boulder-gym-bro/SKILL.md#daily-movement-plan

  - id: boulder-challenge-ping
    name: Boulder Challenge Ping
    member: boulder
    tier: daily
    status: opt-in
    default_timing: "Afternoon and evening (one routine, two fires)"
    purpose: "One-line nudge covering the user's daily push-up and ab challenges together; skip or ping only the remainder once done."
    source: skills/council/members/boulder-gym-bro/SKILL.md#daily-challenge-ping
    aliases: [boulder-afternoon-challenge-ping, boulder-evening-challenge-ping]

  - id: cauldron-morning-meal-plan
    name: Cauldron Morning Meal Plan
    member: cauldron
    tier: daily
    status: opt-in
    default_timing: "Morning"
    purpose: "Today's meals from the active plan, inventory, and leftovers."
    source: skills/council/members/cauldron-meal-planner/SKILL.md#daily-meal-check-ins

  - id: cauldron-evening-meal-check-in
    name: Cauldron Evening Meal Check-in
    member: cauldron
    tier: daily
    status: opt-in
    default_timing: "Evening"
    purpose: "What landed today, a protein note, and tomorrow's default. No guilt recap."
    source: skills/council/members/cauldron-meal-planner/SKILL.md#daily-meal-check-ins

  - id: postmaster-inbox-watch
    name: Postmaster Weekday Inbox Watch
    member: postmaster
    tier: daily
    status: opt-in
    default_timing: "Weekday mornings, except the weekly review day"
    purpose: "Watch the user's connected inboxes; silent unless something urgent cannot wait for the weekly review."
    source: skills/council/members/postmaster-email-triage/SKILL.md#weekday-inbox-watch

  # --- Weekly core ---
  - id: quill-dream-sequence
    name: Quill Dream Sequence
    member: quill
    tier: weekly
    status: active
    default_timing: "Sunday night"
    purpose: "Memory consolidation so the week opens fresh. Report first; apply only within the user's authorization."
    source: skills/mem/dream-sequence/SKILL.md

  - id: cauldron-weekly-meal-plan
    name: Cauldron Weekly Meal Plan
    member: cauldron
    tier: weekly
    status: opt-in
    default_timing: "Sunday evening"
    purpose: "Review last week, plan next week, and prep the grocery cart. Never places the order."
