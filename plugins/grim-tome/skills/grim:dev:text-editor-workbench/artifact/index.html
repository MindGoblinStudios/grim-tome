<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Text Editor Workbench</title>
    <link rel="stylesheet" href="./styles.css" />
  </head>
  <body>
    <main class="editor-shell">
      <aside id="sidebar" class="sidebar">
        <div class="sidebar-head">
          <button
            id="themeToggleButton"
            class="round-button"
            type="button"
            aria-label="Switch color mode"
          >☾</button>
          <button id="newNoteButton" class="round-button" type="button" aria-label="New note">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M12 5v14"></path>
              <path d="M5 12h14"></path>
            </svg>
          </button>
          <button id="collapseButton" type="button" aria-label="Collapse sidebar">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="M15 6 9 12l6 6"></path>
            </svg>
          </button>
        </div>
        <nav id="fileList" class="file-list" aria-label="Text files"></nav>
        <div id="noteMenu" class="context-menu" hidden>
          <button id="copyNotePathButton" type="button">Copy file path</button>
          <button id="deleteNoteButton" type="button">Delete note</button>
        </div>
        <div id="resizeHandle" class="resize-handle" role="separator" aria-orientation="vertical"></div>
      </aside>
      <section class="editor-pane">
        <header>
          <button id="expandButton" type="button" aria-label="Expand sidebar">
            <svg aria-hidden="true" viewBox="0 0 24 24">
              <path d="m9 6 6 6-6 6"></path>
            </svg>
          </button>
        </header>
        <div id="conflict" class="conflict" hidden>
          <span>Disk changed</span>
          <button id="reloadButton" type="button">Reload</button>
          <button id="overwriteButton" type="button">Overwrite</button>
        </div>
        <textarea id="editor" spellcheck="true"></textarea>
      </section>
    </main>
    <script src="./app.js"></script>
  </body>
</html>
